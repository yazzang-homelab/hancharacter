[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hancharacter"
version = "0.1.0"
description = "Voice-preserving localisation: measure a source character's speech-style markers, seal per-character voice contracts, and enforce loss and invention bidirectionally."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hancharacter = "hancharacter.cli:main"

[tool.setuptools.packages.find]
include = ["hancharacter*"]
